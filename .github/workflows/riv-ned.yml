name: Riv ned miljø

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Miljø som skal rives ned
        type: choice
        options: [dev, test]
        required: true
      bekreftelse:
        description: 'Skriv "riv ned <miljø>" for å bekrefte'
        type: string
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: oblig1-${{ inputs.environment }}
  cancel-in-progress: false

env:
  MILJO: ${{ inputs.environment }}
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_INPUT: false
  TF_IN_AUTOMATION: true

jobs:
  # Egen jobb, uten environment: eller id-token: write - kan ikke nå Azure
  # i det hele tatt, uansett hva som skjer her.
  bekreft:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk bekreftelsen
        env:
          BEKREFTELSE: ${{ inputs.bekreftelse }}
          MILJO_INPUT: ${{ inputs.environment }}
        run: |
          if [ "$BEKREFTELSE" != "riv ned $MILJO_INPUT" ]; then
            echo "::error::Ikke bekreftet. Forventet nøyaktig: riv ned $MILJO_INPUT"
            exit 1
          fi
          echo "Bekreftet."

  # Appen river ned FØRST - den avhenger av nettverket, ikke omvendt.
  riv-app:
    needs: bekreft
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: stacks/app

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Hent parameterfila fra Key Vault
        run: |
          az keyvault secret show \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --name "tfvars-$MILJO" \
            --query value -o tsv > params.auto.tfvars

      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/shared/backend.hcl" \
            -backend-config="key=env/$MILJO/app.tfstate"

      - name: Lag en destroy-plan
        run: terraform plan -destroy -out=tfdestroy

      - name: Utfør destroy-planen
        run: terraform apply tfdestroy

      - name: Verifiser at det er tomt
        run: terraform state list

      - name: Slett parameterfila
        if: always()
        run: rm -f params.auto.tfvars

  riv-network:
    needs: riv-app
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: stacks/network

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Hent parameterfila fra Key Vault
        run: |
          az keyvault secret show \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --name "tfvars-$MILJO" \
            --query value -o tsv > params.auto.tfvars

      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/shared/backend.hcl" \
            -backend-config="key=env/$MILJO/network.tfstate"

      - name: Lag en destroy-plan
        run: terraform plan -destroy -out=tfdestroy

      - name: Utfør destroy-planen
        run: terraform apply tfdestroy

      - name: Verifiser at det er tomt
        run: terraform state list

      - name: Slett parameterfila
        if: always()
        run: rm -f params.auto.tfvars
