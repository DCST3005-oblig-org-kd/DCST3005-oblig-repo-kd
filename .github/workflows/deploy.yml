name: Rull ut nettverk og app

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Miljø som skal rulles ut
        type: choice
        options: [dev, test]
        default: dev

permissions:
  id-token: write
  contents: read

concurrency:
  group: oblig1-${{ inputs.environment }}
  cancel-in-progress: false

env:
  MILJO: ${{ inputs.environment }}
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_INPUT: false
  TF_IN_AUTOMATION: true

jobs:
  deploy-network:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: stacks/network

    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Hent parameterfila fra Key Vault
        run: |
          az keyvault secret show \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --name "tfvars-$MILJO" \
            --query value -o tsv > params.auto.tfvars

      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/shared/backend.hcl" \
            -backend-config="key=env/$MILJO/network.tfstate"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan

      - name: Apply
        run: terraform apply -auto-approve

      - name: Verifiser at networket finnes i Azure
        run: |
          RG=$(terraform output -raw resource_group_name)
          VNET=$(terraform output -raw vnet_name)
          STATE=$(az network vnet show --resource-group "$RG" --name "$VNET" \
                    --query provisioningState -o tsv)
          echo "$VNET i $RG: $STATE"
          test "$STATE" = "Succeeded"

      - name: Slett parameterfila
        if: always()
        run: rm -f params.auto.tfvars

  deploy-app:
    needs: deploy-network
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    defaults:
      run:
        working-directory: stacks/app

    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Hent parameterfila fra Key Vault
        run: |
          az keyvault secret show \
            --vault-name "${{ secrets.KEYVAULT_NAME }}" \
            --name "tfvars-$MILJO" \
            --query value -o tsv > params.auto.tfvars

      - name: Init
        run: |
          terraform init \
            -backend-config="${{ github.workspace }}/shared/backend.hcl" \
            -backend-config="key=env/$MILJO/app.tfstate"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan

      - name: Apply
        run: terraform apply -auto-approve

      - name: Slett parameterfila
        if: always()
        run: rm -f params.auto.tfvars
